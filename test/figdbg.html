<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>figdbg</title>
<style>#log{font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;padding:10px;color:#111;background:#fff}body{overflow:auto;margin:0}</style>
</head><body>
<div id="log"></div>
<script src="../vendor/fflate.min.js"></script>
<script src="../js/docx.js"></script>
<script src="../js/rules.js"></script>
<script src="../js/render.js"></script>
<script>
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
window.onerror = (m, s, l, c, e) => { log('JS ERROR: ' + m + ' @' + l + ':' + c); };
function load(file) {
  const xhr = new XMLHttpRequest(); xhr.open('GET', file, false);
  xhr.overrideMimeType('text/plain; charset=x-user-defined'); xhr.send();
  let bin = xhr.responseText, u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i) & 0xff;
  return u8.buffer;
}
try {
  const q = new URLSearchParams(location.search);
  const doc = STUDocx.parse(load(q.get('f') || '_scanoval.docx'));
  const res = STURules.runChecks(doc, 'otchet');
  const sp = (b) => b && b.spacing ? ('b=' + (b.spacing.before||0) + ' a=' + (b.spacing.after||0) + ' line=' + (b.spacing.line||'') + '/' + (b.spacing.lineRule||'')) : '-';
  for (let i = 0; i < doc.blocks.length; i++) {
    const b = doc.blocks[i];
    if (b.kind !== 'p') { log(i + ' [TABLE]'); continue; }
    const t = (b.text || '').replace(/\uFFFC/g, '<IMG>');
    const role = res.roles[i] && res.roles[i].role;
    if (/Рисунок|Цель|сканирование|уязвимости|Устранение|Повторное|Проверка результатов|первичное|Я выбрал/.test(t) || b.hasDrawing || role === 'image' || role === 'figureCaption') {
      log(i + ' [' + role + '] empty=' + b.isEmpty + ' draw=' + !!b.hasDrawing + ' jc=' + b.jc + ' sp={' + sp(b) + '} | ' + JSON.stringify(t.slice(0, 55)));
    }
  }
  log('--- figure blank-line findings ---');
  res.findings.filter(f => /пустой строки|Интервал/.test(f.title)).forEach(f => log('[' + f.level + '] b' + f.blockIndex + ' ' + f.title + ' :: ' + (f.detail||'').slice(0,60)));
} catch (e) { log('CATCH: ' + e.message + '\n' + e.stack); }
</script>
</body></html>
